<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레슬러 양기훈 키우기 V3 : 챔피언 로드</title>
    <style>
        /* CSS 스타일 */
        :root {
            --primary: #ff4757; /* 강렬한 레드 */
            --secondary: #2f3542;
            --accent: #eccc68; /* 골드 */
            --bg: #121212; /* 더 어두운 배경 */
            --text: #f1f2f6;
            --hp-bar: #2ed573;
            --skill-ready: #3742fa;
            --ring-rope: #e84118; /* 로프 색상 */
            --ring-mat: #dcdde1; /* 링 바닥 색상 */
        }

        body {
            font-family: 'Jua', sans-serif, system-ui;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--secondary);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            height: 98vh;
            position: relative;
            border: 3px solid #57606f;
        }

        /* 상단 정보창 */
        header {
            padding: 10px 15px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #57606f;
            z-index: 20;
        }
        .stage-info { font-size: 1.1rem; font-weight: bold; color: var(--accent); text-shadow: 1px 1px 2px black; }
        .reset-btn {
            background: #c23616; color: white; border: none; font-size: 0.7rem; padding: 4px 8px; border-radius: 5px; cursor: pointer;
        }

        /* 배틀 아레나 (레슬링 링 배경) */
        .arena-section {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center top, #57606f 0%, #000000 80%);
            cursor: pointer;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 링 바닥 */
        .arena-section::before {
            content: '';
            position: absolute;
            bottom: -50px;
            width: 120%;
            height: 70%;
            background: 
                linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, var(--ring-mat), #7f8c8d);
            background-size: 20px 20px, 20px 20px, 100% 100%;
            transform: rotateX(60deg);
            border-top: 5px solid #7f8c8d;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5) inset;
            z-index: 1;
        }

        /* 링 로프 */
        .arena-section::after {
            content: '';
            position: absolute;
            top: 30%;
            width: 100%;
            height: 30%;
            background: 
                linear-gradient(to bottom, transparent 10%, var(--ring-rope) 10%, var(--ring-rope) 12%, transparent 12%),
                linear-gradient(to bottom, transparent 48%, var(--ring-rope) 48%, var(--ring-rope) 50%, transparent 50%),
                linear-gradient(to bottom, transparent 88%, var(--ring-rope) 88%, var(--ring-rope) 90%, transparent 90%);
            z-index: 0;
            opacity: 0.7;
        }
        
        .fighters-box, .boss-hp-container, .skill-bar, .damage-text {
            z-index: 10;
            position: relative;
        }

        .fighters-box {
            display: flex;
            justify-content: space-around;
            width: 100%;
            align-items: flex-end;
            padding-bottom: 40px;
            pointer-events: none;
        }
        .fighter { display: flex; flex-direction: column; align-items: center; transition: transform 0.1s; }
        
        /* 이미지 스타일 */
        .kihoon-avatar { 
            width: 140px; /* 크기 조정 */
            height: auto;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.6));
            transition: transform 0.1s;
        }
        
        .boss-avatar { font-size: 5rem; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.1s;}
        
        .attack-anim { transform: translateX(30px) scale(1.1) rotate(-5deg); }
        .hit-anim { transform: translateX(10px) rotate(10deg); filter: brightness(2) sepia(1) red; }

        /* 보스 체력바 */
        .boss-hp-container {
            position: absolute;
            top: 15px;
            width: 85%;
            pointer-events: none;
        }
        .hp-bar-bg { width: 100%; height: 20px; background: #444; border-radius: 10px; border: 2px solid #000; overflow: hidden; position: relative; box-shadow: 0 2px 5px black;}
        .hp-bar-fill { width: 100%; height: 100%; background: var(--hp-bar); transition: width 0.2s linear; }
        .hp-text-overlay { position: absolute; width: 100%; text-align: center; top:0; line-height: 20px; font-size: 0.8rem; text-shadow: 1px 1px 1px #000; font-weight: bold;}

        /* 스킬 버튼 */
        .skill-bar {
            position: absolute;
            bottom: 10px;
            width: 90%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .skill-btn {
            background: var(--skill-ready);
            border: 2px solid #fff;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e272e;
            transition: all 0.1s;
        }
        .skill-btn:active { transform: translateY(4px); box-shadow: none; }
        .skill-btn.cooldown { background: #57606f; color: #a4b0be; border-color: #747d8c; pointer-events: none; }
        .skill-active { animation: glow 0.5s infinite alternate; background: #ff4757 !important; border-color: yellow;}

        @keyframes glow { from { box-shadow: 0 0 10px #ff4757; transform: scale(1); } to { box-shadow: 0 0 25px #ff4757; transform: scale(1.05); } }

        /* 스탯 정보 */
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #222f3e;
            padding: 8px;
            border-top: 2px solid #57606f;
            text-align: center;
            box-shadow: 0 -5px 10px rgba(0,0,0,0.3);
            z-index: 20;
        }
        .stat-item { border-right: 1px solid #57606f; }
        .stat-item:last-child { border-right: none; }
        .stat-title { font-size: 0.7rem; color: #a4b0be; }
        .stat-val { font-size: 1rem; font-weight: bold; text-shadow: 1px 1px 1px black;}
        
        /* 탭 메뉴 */
        .tab-menu { display: flex; background: #1e272e; z-index: 20;}
        .tab-btn {
            flex: 1; padding: 12px; background: #2f3542; border: none; color: #747d8c; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; font-size: 0.9rem; transition: 0.2s;
        }
        .tab-btn.active { color: var(--text); background: #3e4a5e; border-bottom: 3px solid var(--primary); }
        .tab-btn:hover:not(.active) { background: #353b48; color: #a4b0be; }

        /* 상점 리스트 */
        .shop-container {
            height: 32%;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 5px;
        }
        .shop-container::-webkit-scrollbar { width: 8px; }
        .shop-container::-webkit-scrollbar-thumb { background: #57606f; border-radius: 4px; }
        .shop-container::-webkit-scrollbar-track { background: #2f3542; }

        .upgrade-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #3e4a5e; padding: 10px 12px; margin-bottom: 6px; border-radius: 8px; border-left: 4px solid #747d8c; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .upgrade-item.affordable { border-left-color: var(--hp-bar); cursor: pointer; }
        .upgrade-item.affordable:hover { background: #4b6584; transform: translateX(2px); }
        .upgrade-item:active { transform: scale(0.98); }
        
        .item-info h4 { margin: 0; font-size: 0.95rem; }
        .item-info p { margin: 3px 0 0; font-size: 0.75rem; color: #ced6e0; }
        .item-cost { font-weight: bold; background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; min-width: 60px; text-align: center; color: var(--accent); }

        /* 이펙트 */
        .damage-text {
            position: absolute; font-weight: 900; font-size: 1.5rem; pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            z-index: 100;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(0.5); opacity: 0; } 
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; } 
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <div class="stage-info" id="stage-display">STAGE 1</div>
        <button class="reset-btn" onclick="resetData()">데이터 초기화</button>
    </header>

    <div class="arena-section" id="click-zone">
        <div class="boss-hp-container">
            <div style="text-align: center; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; text-shadow: 1px 1px 2px black;" id="boss-name">VS 샌드백</div>
            <div class="hp-bar-bg">
                <div class="hp-bar-fill" id="hp-bar"></div>
                <div class="hp-text-overlay" id="hp-text">100 / 100</div>
            </div>
        </div>

        <div class="fighters-box">
            <div class="fighter">
                <img src="https://raw.githubusercontent.com/Tarikul-Islam-Anik/Animated-Fluent-Emojis/master/Emojis/People/Person%20Wrestling%20Medium%20Light%20Skin%20Tone.png" 
                     alt="플레이어" class="kihoon-avatar" id="player-avatar">
                <div style="font-size: 0.8rem; text-shadow: 1px 1px 2px black; margin-top:5px;" id="player-title">초보 레슬러</div>
            </div>
            <div class="fighter">
                <div class="boss-avatar" id="boss-avatar">🥊</div>
            </div>
        </div>

        <div class="skill-bar">
            <button class="skill-btn" id="btn-skill-1" onclick="useSkill('rage')">🔥 폭주 (공격 2배)</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-title">💰 보유 머니</div>
            <div class="stat-val" style="color:#eccc68;" id="money-display">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-title">🥊 나의 공격력</div>
            <div class="stat-val" style="color:#ff4757;" id="power-display">1</div>
        </div>
        <div class="stat-item">
            <div class="stat-title">👥 태그팀 DPS</div>
            <div class="stat-val" style="color:#2ed573;" id="dps-display">0</div>
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('tab-train')">💪 훈련하기</button>
        <button class="tab-btn" onclick="switchTab('tab-team')">🤝 태그팀 고용</button>
        <button class="tab-btn" onclick="switchTab('tab-biz')">💵 돈벌기</button>
    </div>

    <div class="shop-container" id="tab-train"></div>
    <div class="shop-container" id="tab-team" style="display: none;"></div>
    <div class="shop-container" id="tab-biz" style="display: none;"></div>
</div>

<script>
    /* ========== 게임 로직 (수정 없음) ========== */
    const defaultData = {
        money: 0,
        clickDmg: 1,
        autoDmg: 0,
        incomeMult: 1, 
        stage: 1,
        bossHp: 50,
        trainLv: [0,0,0,0,0,0],
        teamLv: [0,0,0,0,0],
        bizLv: [0,0,0,0]
    };

    let game = JSON.parse(JSON.stringify(defaultData));
    let skillActive = false;
    let skillMultiplier = 1;

    const bosses = [
        {name: "샌드백", hp: 50, icon: "🥊"},
        {name: "체육관 관장", hp: 500, icon: "🦍"},
        {name: "동네 불량배", hp: 2000, icon: "🚬"},
        {name: "복면 레슬러", hp: 10000, icon: "👺"},
        {name: "불곰 파이터", hp: 50000, icon: "🐻"},
        {name: "스모 챔피언", hp: 200000, icon: "🍙"},
        {name: "언더테이커", hp: 1000000, icon: "⚰️"},
        {name: "외계인", hp: 50000000, icon: "👽"}
    ];

    const trainingList = [ 
        { name: "팔굽혀펴기", cost: 10, val: 1, desc: "기본 근력 단련" },
        { name: "벤치프레스", cost: 150, val: 10, desc: "가슴 근육 폭발" },
        { name: "드롭킥 연습", cost: 1000, val: 50, desc: "찰진 타격감" },
        { name: "수플렉스", cost: 10000, val: 300, desc: "상대를 던져버림" },
        { name: "툼스톤", cost: 100000, val: 1500, desc: "강력한 필살기" },
        { name: "챔피언의 주먹", cost: 5000000, val: 10000, desc: "전설의 핵주먹" }
    ];

    const teamList = [ 
        { name: "스파링 파트너", cost: 100, val: 5, desc: "옆에서 잽을 날려줌" },
        { name: "아마추어 용병", cost: 1000, val: 30, desc: "돈 받고 싸워줌" },
        { name: "태그팀 파트너", cost: 15000, val: 200, desc: "든든한 아군" },
        { name: "레슬링 협회장", cost: 200000, val: 1000, desc: "권력으로 공격" },
        { name: "클론 양기훈", cost: 3000000, val: 5000, desc: "또 다른 나" }
    ];

    const bizList = [ 
        { name: "전단지 알바", cost: 50, val: 1, desc: "클릭 수입 +1" },
        { name: "유튜브 방송", cost: 500, val: 5, desc: "클릭 수입 +5" },
        { name: "체육관 오픈", cost: 10000, val: 50, desc: "클릭 수입 +50" },
        { name: "프랜차이즈", cost: 500000, val: 500, desc: "클릭 수입 +500" }
    ];

    function init() {
        if(localStorage.getItem('kihoonV3_Design')) {
            game = { ...defaultData, ...JSON.parse(localStorage.getItem('kihoonV3_Design')) };
        }
        renderShops();
        updateUI();
        gameLoop();
    }

    function gameLoop() {
        setInterval(() => {
            if (game.autoDmg > 0) {
                const dmgPerTick = game.autoDmg / 10; 
                damageBoss(dmgPerTick, false); 
            }
            saveData();
        }, 100);
    }

    const clickZone = document.getElementById('click-zone');
    clickZone.addEventListener('mousedown', (e) => handleHit(e));
    clickZone.addEventListener('touchstart', (e) => { e.preventDefault(); handleHit(e.touches[0]); }, {passive:false});

    function handleHit(e) {
        game.money += (game.incomeMult + (game.clickDmg * 0.05)); 
        
        let finalDmg = game.clickDmg * skillMultiplier;
        let isCrit = Math.random() < 0.1;
        if(isCrit) finalDmg *= 2;

        damageBoss(finalDmg, true);
        showEffect(e.clientX, e.clientY, formatNum(Math.floor(finalDmg)), isCrit || skillActive);
        
        const avatar = document.getElementById('player-avatar');
        avatar.classList.remove('attack-anim');
        void avatar.offsetWidth; 
        avatar.classList.add('attack-anim');

        updateUI();
    }

    function damageBoss(dmg, isClick) {
        if(game.bossHp > 0) {
            game.bossHp -= dmg;
            if(game.bossHp <= 0) {
                game.bossHp = 0;
                bossDefeated();
            }
        }
        updateBossUI();
    }

    function bossDefeated() {
        const reward = getBossMaxHp(game.stage) * 0.25; 
        game.money += reward;
        game.stage++;
        game.bossHp = getBossMaxHp(game.stage);
        
        const rect = clickZone.getBoundingClientRect();
        showEffect(rect.left + rect.width/2, rect.top + rect.height/2 - 50, `👑 STAGE CLEAR!`, true);
        setTimeout(() => {
             showEffect(rect.left + rect.width/2, rect.top + rect.height/2, `+${formatNum(reward)}원`, true);
        }, 200);
    }

    window.useSkill = function(type) {
        const btn = document.getElementById('btn-skill-1');
        if(btn.classList.contains('cooldown')) return;

        skillActive = true;
        skillMultiplier = 2; 
        btn.classList.add('skill-active');
        btn.innerText = "🤬 폭주 중! (데미지 2배)";

        setTimeout(() => {
            skillActive = false;
            skillMultiplier = 1;
            btn.classList.remove('skill-active');
            btn.classList.add('cooldown');
            btn.innerText = "😓 지침 (쿨타임...)";
            setTimeout(() => {
                btn.classList.remove('cooldown');
                btn.innerText = "🔥 폭주 (공격 2배)";
            }, 5000);
        }, 10000);
    }

    function buyUpgrade(type, idx) {
        let list, lvArr, costFactor, statKey;
        if(type === 'train') {
            list = trainingList; lvArr = game.trainLv; costFactor = 1.5; statKey = 'clickDmg';
        } else if(type === 'team') {
            list = teamList; lvArr = game.teamLv; costFactor = 1.4; statKey = 'autoDmg';
        } else {
            list = bizList; lvArr = game.bizLv; costFactor = 1.4; statKey = 'incomeMult';
        }

        const baseCost = list[idx].cost;
        const currentLv = lvArr[idx];
        const cost = Math.floor(baseCost * Math.pow(costFactor, currentLv));

        if(game.money >= cost) {
            game.money -= cost;
            lvArr[idx]++;
            game[statKey] += list[idx].val;
            updateUI();
            renderShops(); 
        }
    }

    function renderShops() {
        renderList('tab-train', trainingList, game.trainLv, 'train');
        renderList('tab-team', teamList, game.teamLv, 'team');
        renderList('tab-biz', bizList, game.bizLv, 'biz');
    }

    function renderList(containerId, list, lvArr, type) {
        const con = document.getElementById(containerId);
        con.innerHTML = "";
        list.forEach((item, idx) => {
            const lv = lvArr[idx];
            let costFactor = type === 'train' ? 1.5 : 1.4;
            const cost = Math.floor(item.cost * Math.pow(costFactor, lv));
            const div = document.createElement('div');
            div.className = `upgrade-item ${game.money >= cost ? 'affordable' : ''}`;
            div.onclick = () => buyUpgrade(type, idx);
            div.innerHTML = `
                <div class="item-info">
                    <h4>${item.name} <span style="font-size:0.7rem; color:#aaa;">Lv.${lv}</span></h4>
                    <p>${item.desc} (+${formatNum(item.val)})</p>
                </div>
                <div class="item-cost">${formatNum(cost)}</div>
            `;
            con.appendChild(div);
        });
    }

    function updateUI() {
        document.getElementById('money-display').innerText = formatNum(Math.floor(game.money));
        document.getElementById('power-display').innerText = formatNum(game.clickDmg * skillMultiplier);
        document.getElementById('dps-display').innerText = formatNum(game.autoDmg);
    }

    function updateBossUI() {
        const maxHp = getBossMaxHp(game.stage);
        const bossIdx = (game.stage - 1) % bosses.length;
        const bossInfo = bosses[bossIdx];
        const loopNum = Math.ceil(game.stage/bosses.length);
        
        document.getElementById('stage-display').innerText = `STAGE ${game.stage}`;
        document.getElementById('boss-name').innerText = `VS ${bossInfo.name} ${loopNum > 1 ? '(Lv.'+loopNum+')' : ''}`;
        document.getElementById('boss-avatar').innerText = bossInfo.icon;

        const hpPer = Math.max(0, (game.bossHp / maxHp) * 100);
        document.getElementById('hp-bar').style.width = hpPer + "%";
        document.getElementById('hp-text').innerText = `${formatNum(Math.ceil(game.bossHp))} / ${formatNum(maxHp)}`;

        let title = "초보 레슬러";
        if(game.stage > 5) title = "아마추어 에이스";
        if(game.stage > 15) title = "프로 레슬러";
        if(game.stage > 30) title = "메인 이벤터";
        if(game.stage > 50) title = "월드 챔피언";
        document.getElementById('player-title').innerText = title;
    }

    function getBossMaxHp(stage) {
        const base = bosses[(stage-1) % bosses.length].hp;
        const scale = Math.floor((stage-1) / bosses.length);
        return Math.floor(base * Math.pow(2.2, scale)); 
    }

    function formatNum(num) {
        if(num >= 1000000000) return (num/1000000000).toFixed(2) + "G";
        if(num >= 1000000) return (num/1000000).toFixed(2) + "M";
        if(num >= 1000) return (num/1000).toFixed(1) + "K";
        return num.toLocaleString();
    }

    function showEffect(x, y, text, isCrit) {
        const el = document.createElement('div');
        el.className = 'damage-text';
        el.innerText = text;
        el.style.left = (x - 30 + (Math.random()*20-10)) + "px"; 
        el.style.top = (y - 50) + "px";
        if(isCrit) {
            el.style.color = "#ff4757";
            el.style.fontSize = "1.8rem";
            el.style.zIndex = 200;
            el.style.textShadow = "0 0 10px #ff4757";
        } else {
            el.style.color = "#fff";
        }
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 700);
    }

    function saveData() { localStorage.setItem('kihoonV3_Design', JSON.stringify(game)); }
    function resetData() { 
        if(confirm("정말 모든 데이터를 초기화 하시겠습니까?")) { 
            localStorage.removeItem('kihoonV3_Design'); location.reload(); 
        } 
    }
    
    window.switchTab = function(id) {
        document.querySelectorAll('.shop-container').forEach(e => e.style.display='none');
        document.getElementById(id).style.display='block';
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        event.target.classList.add('active');
        renderShops();
    }

    init();
</script>
</body>
</html>
