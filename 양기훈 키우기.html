<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레슬러 양기훈 키우기 V3</title>
    <style>
        /* CSS 스타일 */
        :root {
            --primary: #ff4757; 
            --secondary: #2f3542;
            --accent: #eccc68; 
            --bg: #1e272e;
            --text: #f1f2f6;
            --hp-bar: #2ed573;
            --skill-ready: #3742fa;
        }

        body {
            font-family: 'Jua', sans-serif, system-ui;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--secondary);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            height: 98vh;
            position: relative;
            border: 4px solid #57606f;
            overflow: hidden; /* 배경 튀어나감 방지 */
        }

        /* 상단 정보창 */
        header {
            padding: 10px 15px;
            background: rgba(0,0,0,0.6); /* 배경이 진해졌으므로 좀 더 어둡게 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #57606f;
            z-index: 10;
        }
        .stage-info { font-size: 1.1rem; font-weight: bold; color: var(--accent); text-shadow: 1px 1px 0 #000; }
        .reset-btn {
            background: #ff6b81; color: white; border: none; font-size: 0.7rem; padding: 4px 8px; border-radius: 5px; cursor: pointer;
        }

        /* [변경됨] 배틀 아레나 - 배경 이미지 적용 */
        .arena-section {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            /* 여기에 링 배경 이미지가 들어갑니다 */
            background-image: url('bg.jpg'); 
            background-size: cover; /* 화면 꽉 차게 */
            background-position: center;
            
            cursor: pointer;
            overflow: hidden;
        }

        /* 배경이 어두울 수도, 밝을 수도 있으니 텍스트 가독성 확보 */
        .arena-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.1); /* 살짝 어둡게 덮기 */
            pointer-events: none;
        }
        
        /* 캐릭터 및 애니메이션 */
        .fighters-box {
            display: flex;
            justify-content: space-around;
            width: 100%;
            align-items: flex-end; /* 발바닥 맞춤 */
            padding-bottom: 40px; /* 링 바닥 위치 조절 */
            pointer-events: none;
            z-index: 5;
        }
        
        .fighter { display: flex; flex-direction: column; align-items: center; transition: transform 0.1s; position: relative;}
        
        /* [변경됨] 플레이어 이미지 스타일 */
        .kihoon-avatar { 
            width: 160px; /* 이미지 크기 키움 */
            height: auto;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7)); 
            transition: transform 0.1s;
            /* 둥글게 깎기 */
            border-radius: 10px;
        }

        .player-info-badge {
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: -10px;
            z-index: 6;
            border: 1px solid var(--primary);
        }
        
        .boss-avatar { font-size: 6rem; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); transition: transform 0.1s;}
        
        .attack-anim { transform: translateX(30px) scale(1.05) rotate(5deg); } /* 때리는 모션 */
        .hit-anim { transform: translateX(10px) rotate(-10deg); filter: brightness(2) sepia(1) red; }

        /* 보스 체력바 */
        .boss-hp-container {
            position: absolute;
            top: 15px;
            width: 85%;
            pointer-events: none;
            z-index: 10;
        }
        .hp-bar-bg { width: 100%; height: 25px; background: #333; border-radius: 15px; border: 3px solid #000; overflow: hidden; position: relative; box-shadow: 0 5px 5px rgba(0,0,0,0.5);}
        .hp-bar-fill { width: 100%; height: 100%; background: var(--hp-bar); transition: width 0.2s linear; }
        .hp-text-overlay { position: absolute; width: 100%; text-align: center; top:0; line-height: 25px; font-size: 0.9rem; text-shadow: 1px 1px 2px #000; font-weight: bold; color: white;}
        .boss-name-tag {
            text-align: center; margin-bottom: 5px; font-size: 1rem; font-weight: bold; 
            color: white; text-shadow: 2px 2px 0 #000;
            background: rgba(0,0,0,0.5); display: inline-block; padding: 2px 10px; border-radius: 10px;
        }

        /* 스킬 버튼 영역 */
        .skill-bar {
            position: absolute;
            bottom: 15px;
            width: 90%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }
        .skill-btn {
            background: var(--skill-ready);
            border: 2px solid #fff;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #192a56;
            transition: all 0.1s;
        }
        .skill-btn:active { transform: translateY(4px); box-shadow: none; }
        .skill-btn.cooldown { background: #57606f; color: #a4b0be; border-color: #747d8c; pointer-events: none; }
        .skill-active { animation: glow 0.5s infinite alternate; background: #ff4757 !important; border-color: #ffbd59;}

        @keyframes glow { from { box-shadow: 0 0 10px #ff4757; transform: scale(1); } to { box-shadow: 0 0 30px #ff4757; transform: scale(1.05); } }

        /* 스탯 정보 */
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: #2f3542;
            padding: 8px;
            border-top: 2px solid #57606f;
            text-align: center;
            z-index: 20;
        }
        .stat-item { border-right: 1px solid #57606f; }
        .stat-item:last-child { border-right: none; }
        .stat-title { font-size: 0.7rem; color: #a4b0be; }
        .stat-val { font-size: 1rem; font-weight: bold; }
        
        /* 탭 메뉴 */
        .tab-menu { display: flex; background: #1e272e; z-index: 20; }
        .tab-btn {
            flex: 1; padding: 12px; background: #2f3542; border: none; color: #747d8c; font-weight: bold; cursor: pointer; border-bottom: 4px solid transparent; font-size: 0.9rem;
        }
        .tab-btn.active { color: var(--text); background: #3e4a5e; border-bottom: 4px solid var(--primary); }

        /* 상점 리스트 */
        .shop-container {
            height: 32%;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            z-index: 20;
        }
        .upgrade-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #3e4a5e; padding: 10px 12px; margin-bottom: 5px; border-radius: 8px; border-left: 5px solid #747d8c;
        }
        .upgrade-item.affordable { border-left-color: var(--hp-bar); cursor: pointer; }
        .upgrade-item.affordable:hover { background: #4b6584; }
        
        .item-info h4 { margin: 0; font-size: 1rem; }
        .item-info p { margin: 2px 0 0; font-size: 0.8rem; color: #ced6e0; }
        .item-cost { font-weight: bold; background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; min-width: 60px; text-align: center; }

        /* 이펙트 */
        .damage-text {
            position: absolute; font-weight: 900; font-size: 2rem; pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            z-index: 100;
            font-style: italic;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(-80px) scale(1.5) rotate(10deg); opacity: 0; } 
        }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <div class="stage-info" id="stage-display">STAGE 1</div>
        <button class="reset-btn" onclick="resetData()">RESET</button>
    </header>

    <div class="arena-section" id="click-zone">
        <div class="arena-overlay"></div> <div class="boss-hp-container">
            <div style="text-align: center;">
                <span class="boss-name-tag" id="boss-name">VS 샌드백</span>
            </div>
            <div class="hp-bar-bg">
                <div class="hp-bar-fill" id="hp-bar"></div>
                <div class="hp-text-overlay" id="hp-text">100 / 100</div>
            </div>
        </div>

        <div class="fighters-box">
            <div class="fighter">
                <img src="kihoon.jpg" alt="양기훈" class="kihoon-avatar" id="player-avatar" onerror="this.src='https://toss.tech/static/images/404/img_404_text.png'; this.style.backgroundColor='white'; alert('kihoon.jpg 파일을 같은 폴더에 넣어주세요!');">
                
                <div class="player-info-badge">
                    <div style="font-size: 0.8rem; font-weight:bold;" id="player-title">신인 레슬러</div>
                </div>
            </div>

            <div class="fighter">
                <div class="boss-avatar" id="boss-avatar">🥊</div>
            </div>
        </div>

        <div class="skill-bar">
            <button class="skill-btn" id="btn-skill-1" onclick="useSkill('rage')">🔥 폭주 (공격 2배)</button>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-title">MONEY</div>
            <div class="stat-val" style="color:#eccc68;" id="money-display">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-title">POWER</div>
            <div class="stat-val" style="color:#ff4757;" id="power-display">1</div>
        </div>
        <div class="stat-item">
            <div class="stat-title">DPS (AUTO)</div>
            <div class="stat-val" style="color:#2ed573;" id="dps-display">0</div>
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('tab-train')">💪 훈련</button>
        <button class="tab-btn" onclick="switchTab('tab-team')">🤝 태그팀</button>
        <button class="tab-btn" onclick="switchTab('tab-biz')">💰 사업</button>
    </div>

    <div class="shop-container" id="tab-train"></div>
    <div class="shop-container" id="tab-team" style="display: none;"></div>
    <div class="shop-container" id="tab-biz" style="display: none;"></div>
</div>

<script>
    /* ========== 게임 데이터 ========== */
    const defaultData = {
        money: 0,
        clickDmg: 1,
        autoDmg: 0,
        incomeMult: 1, 
        stage: 1,
        bossHp: 50,
        
        trainLv: [0,0,0,0,0,0],
        teamLv: [0,0,0,0,0],
        bizLv: [0,0,0,0]
    };

    let game = JSON.parse(JSON.stringify(defaultData));
    
    // 스킬 상태
    let skillActive = false;
    let skillMultiplier = 1;

    /* ========== 설정 데이터 ========== */
    const bosses = [
        {name: "샌드백", hp: 50, icon: "🥊"},
        {name: "체육관 관장", hp: 500, icon: "🦍"},
        {name: "동네 불량배", hp: 2000, icon: "🚬"},
        {name: "복면 레슬러", hp: 10000, icon: "👺"},
        {name: "불곰 파이터", hp: 50000, icon: "🐻"},
        {name: "스모 챔피언", hp: 200000, icon: "🍙"},
        {name: "언더테이커", hp: 1000000, icon: "⚰️"},
        {name: "외계인", hp: 50000000, icon: "👽"}
    ];

    const trainingList = [ 
        { name: "팔굽혀펴기", cost: 10, val: 1, desc: "기본 근력" },
        { name: "벤치프레스", cost: 150, val: 10, desc: "가슴 근육 폭발" },
        { name: "드롭킥 연습", cost: 1000, val: 50, desc: "타격감 굿" },
        { name: "수플렉스", cost: 10000, val: 300, desc: "던져버리기" },
        { name: "툼스톤", cost: 100000, val: 1500, desc: "필살기 연마" },
        { name: "신의 주먹", cost: 5000000, val: 10000, desc: "핵주먹" }
    ];

    const teamList = [ 
        { name: "스파링 파트너", cost: 100, val: 5, desc: "잽을 날려줍니다." },
        { name: "아마추어 용병", cost: 1000, val: 30, desc: "돈 받고 싸웁니다." },
        { name: "태그팀 파트너", cost: 15000, val: 200, desc: "든든한 아군." },
        { name: "레슬링 협회장", cost: 200000, val: 1000, desc: "권력으로 공격." },
        { name: "클론 양기훈", cost: 3000000, val: 5000, desc: "또 다른 나." }
    ];

    const bizList = [ 
        { name: "전단지 알바", cost: 50, val: 1, desc: "수입 +1" },
        { name: "유튜브 방송", cost: 500, val: 5, desc: "수입 +5" },
        { name: "체육관 오픈", cost: 10000, val: 50, desc: "수입 +50" },
        { name: "프랜차이즈", cost: 500000, val: 500, desc: "수입 +500" }
    ];

    /* ========== 엔진 로직 ========== */

    function init() {
        if(localStorage.getItem('kihoonV3')) {
            game = { ...defaultData, ...JSON.parse(localStorage.getItem('kihoonV3')) };
        }
        renderShops();
        updateUI();
        gameLoop();
    }

    // 0.1초마다 실행되는 루프
    function gameLoop() {
        setInterval(() => {
            if (game.autoDmg > 0) {
                const dmgPerTick = game.autoDmg / 10; 
                damageBoss(dmgPerTick, false); 
            }
            saveData();
        }, 100);
    }

    // 클릭/터치 처리
    const clickZone = document.getElementById('click-zone');
    clickZone.addEventListener('mousedown', (e) => handleHit(e));
    clickZone.addEventListener('touchstart', (e) => { e.preventDefault(); handleHit(e.touches[0]); }, {passive:false});

    function handleHit(e) {
        // 돈 획득
        game.money += (game.incomeMult + (game.clickDmg * 0.1)); 
        
        // 보스 공격
        let finalDmg = game.clickDmg * skillMultiplier;
        damageBoss(finalDmg, true);

        // 시각 효과
        showEffect(e.clientX, e.clientY, formatNum(Math.floor(finalDmg)), skillActive);
        
        // 아바타 애니메이션 (이미지)
        const avatar = document.getElementById('player-avatar');
        avatar.classList.remove('attack-anim');
        void avatar.offsetWidth; 
        avatar.classList.add('attack-anim');

        updateUI();
    }

    function damageBoss(dmg, isClick) {
        if(game.bossHp > 0) {
            game.bossHp -= dmg;
            if(game.bossHp <= 0) {
                game.bossHp = 0;
                bossDefeated();
            }
        }
        updateBossUI();
    }

    function bossDefeated() {
        const reward = getBossMaxHp(game.stage) * 0.2; 
        game.money += reward;
        game.stage++;
        game.bossHp = getBossMaxHp(game.stage);
        
        const rect = clickZone.getBoundingClientRect();
        showEffect(rect.left + rect.width/2, rect.top + rect.height/2, `WIN! +${formatNum(reward)}원`, true);
    }

    // 스킬 시스템
    window.useSkill = function(type) {
        const btn = document.getElementById('btn-skill-1');
        if(btn.classList.contains('cooldown')) return;

        skillActive = true;
        skillMultiplier = 2; 
        btn.classList.add('skill-active');
        btn.innerText = "🔥 폭주 (2배)";

        setTimeout(() => {
            skillActive = false;
            skillMultiplier = 1;
            btn.classList.remove('skill-active');
            btn.classList.add('cooldown');
            btn.innerText = "쿨타임...";
            
            setTimeout(() => {
                btn.classList.remove('cooldown');
                btn.innerText = "🔥 폭주 (공격 2배)";
            }, 5000);
        }, 10000);
    }

    // 상점 구매
    function buyUpgrade(type, idx) {
        let list, lvArr, costFactor, statKey;
        
        if(type === 'train') {
            list = trainingList; lvArr = game.trainLv; costFactor = 1.4; statKey = 'clickDmg';
        } else if(type === 'team') {
            list = teamList; lvArr = game.teamLv; costFactor = 1.4; statKey = 'autoDmg';
        } else {
            list = bizList; lvArr = game.bizLv; costFactor = 1.4; statKey = 'incomeMult';
        }

        const baseCost = list[idx].cost;
        const currentLv = lvArr[idx];
        const cost = Math.floor(baseCost * Math.pow(costFactor, currentLv));

        if(game.money >= cost) {
            game.money -= cost;
            lvArr[idx]++;
            game[statKey] += list[idx].val;
            updateUI();
            renderShops(); 
        }
    }

    // UI 렌더링
    function renderShops() {
        renderList('tab-train', trainingList, game.trainLv, 'train');
        renderList('tab-team', teamList, game.teamLv, 'team');
        renderList('tab-biz', bizList, game.bizLv, 'biz');
    }

    function renderList(containerId, list, lvArr, type) {
        const con = document.getElementById(containerId);
        con.innerHTML = "";
        list.forEach((item, idx) => {
            const lv = lvArr[idx];
            const cost = Math.floor(item.cost * Math.pow(1.4, lv));
            const div = document.createElement('div');
            div.className = `upgrade-item ${game.money >= cost ? 'affordable' : ''}`;
            div.onclick = () => buyUpgrade(type, idx);
            div.innerHTML = `
                <div class="item-info">
                    <h4>${item.name} <span style="font-size:0.7rem; color:#aaa;">Lv.${lv}</span></h4>
                    <p>${item.desc} (+${formatNum(item.val)})</p>
                </div>
                <div class="item-cost">${formatNum(cost)}</div>
            `;
            con.appendChild(div);
        });
    }

    function updateUI() {
        document.getElementById('money-display').innerText = formatNum(Math.floor(game.money));
        document.getElementById('power-display').innerText = formatNum(game.clickDmg * skillMultiplier);
        document.getElementById('dps-display').innerText = formatNum(game.autoDmg);
    }

    function updateBossUI() {
        const maxHp = getBossMaxHp(game.stage);
        const bossIdx = (game.stage - 1) % bosses.length;
        const bossInfo = bosses[bossIdx];
        
        document.getElementById('stage-display').innerText = `STAGE ${game.stage}`;
        document.getElementById('boss-name').innerText = `VS ${bossInfo.name}`;
        document.getElementById('boss-avatar').innerText = bossInfo.icon;

        const hpPer = Math.max(0, (game.bossHp / maxHp) * 100);
        document.getElementById('hp-bar').style.width = hpPer + "%";
        document.getElementById('hp-text').innerText = `${formatNum(Math.ceil(game.bossHp))} / ${formatNum(maxHp)}`;
        
        // 캐릭터 칭호 업데이트
        let playerTitle = "신인 레슬러";
        if(game.stage > 5) playerTitle = "프로 레슬러";
        if(game.stage > 10) playerTitle = "메인 이벤터";
        if(game.stage > 20) playerTitle = "세계 챔피언";
        document.getElementById('player-title').innerText = playerTitle;
    }

    function getBossMaxHp(stage) {
        const base = bosses[(stage-1) % bosses.length].hp;
        const scale = Math.floor((stage-1) / bosses.length);
        return Math.floor(base * Math.pow(2.2, scale)); 
    }

    function formatNum(num) {
        if(num >= 100000000) return (num/100000000).toFixed(2) + "억";
        if(num >= 10000) return (num/10000).toFixed(1) + "만";
        return num.toLocaleString();
    }

    function showEffect(x, y, text, isCrit) {
        const el = document.createElement('div');
        el.className = 'damage-text';
        el.innerText = text;
        el.style.left = (x - 30) + "px";
        el.style.top = (y - 50) + "px";
        if(isCrit) {
            el.style.color = "#ff4757";
            el.style.fontSize = "2.5rem";
        } else {
            el.style.color = "#fff";
        }
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 600);
    }

    function saveData() { localStorage.setItem('kihoonV3', JSON.stringify(game)); }
    function resetData() { 
        if(confirm("초기화 하시겠습니까?")) { localStorage.removeItem('kihoonV3'); location.reload(); } 
    }
    
    window.switchTab = function(id) {
        document.querySelectorAll('.shop-container').forEach(e => e.style.display='none');
        document.getElementById(id).style.display='block';
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        event.target.classList.add('active');
        renderShops();
    }

    init();

</script>
</body>
</html>
